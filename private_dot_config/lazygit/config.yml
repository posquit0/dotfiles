git:
  pagers:
  - colorArg: always
    pager: delta --dark --paging=never

gui:
  nerdFontsVersion: "3"

customCommands:
# The backend is whatever $ZSH_AI_PROVIDER selects (claude-code, kiro-cli or
# codex); see ~/scripts/ai-commit-msg. The message opens in the editor, so a
# bad suggestion can still be fixed or abandoned before committing.
- key: <c-a>
  context: files
  command: msg=$(ai-commit-msg) && git commit -e -m "$msg"
  description: 'AI commit message'
  loadingText: 'Generating commit message...'
  output: terminal
