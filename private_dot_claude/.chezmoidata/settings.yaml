claude:
  cleanupPeriodDays: 30
  # Hide Claude attribution in git commits and PR descriptions (replaces deprecated includeCoAuthoredBy)
  attribution:
    commit: ""
    pr: ""

  modelSettings:
    claude-opus-5-5:
      effortLevel: xhigh
    claude-fable-5-1:
      effortLevel: high
    claude-fable-5-2:
      effortLevel: high

  extraKnownMarketplaces:
    terminal-browser:
      source:
        source: github
        repo: zenbu-labs/terminal-browser

  enabledPlugins:
    terminal-browser@terminal-browser: true

  pluginConfigs:
    terminal-browser@terminal-browser:
      options:
        agentTool: true

  permissions:
    defaultMode: auto
    allow:
    - Bash(cat:*)
    - Bash(git add:*)
    - Bash(git checkout:*)
    - Bash(git commit:*)
    - Bash(git diff:*)
    - Bash(git push:*)
    - Bash(ls:*)
    - Bash(mv:*)
    - Bash(source:*)
    - Read(~/.zshrc)
    - WebFetch(domain:docs.aws.amazon.com)
    - WebFetch(domain:registry.terraform.io)
    - WebFetch(domain:developer.hashicorp.com)
    deny:
    - Bash(curl:*)

  hooks:
    PreToolUse:
    - matcher: Bash
      hooks:
      - type: command
        command: "jq -r '\"\\(.tool_input.command) - \\(.tool_input.description // \"No description\")\"' >> ~/.claude/bash-command-log.txt"

  env:
    CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"
    # CLAUDE_CODE_ENABLE_TELEMETRY: "1"
    # OTEL_METRICS_EXPORTER: "otlp"
