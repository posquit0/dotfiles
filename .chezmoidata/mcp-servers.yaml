mcp_servers:
  aws-knowledge-mcp-server:
    command: uvx
    args:
    - fastmcp
    - run
    - https://knowledge-mcp.global.api.aws

  context7:
    command: npx
    args:
    - -y
    - "@upstash/context7-mcp"

  github:
    command: gopass
    args:
    - env
    - --keep-case
    - env/ai-agent
    - --
    - docker
    - run
    - -i
    - --rm
    - -e
    - GITHUB_PERSONAL_ACCESS_TOKEN
    - ghcr.io/github/github-mcp-server

  gitnexus:
    command: npx
    args:
    - -y
    - gitnexus@latest
    - mcp

  mise:
    command: /opt/homebrew/bin/mise
    args:
    - mcp
    env:
      MISE_EXPERIMENTAL: "1"

  playwright:
    command: playwright-mcp
    args:
    - --config=${HOME}/.playwright/config.json
    - --browser chrome-dev

  # railway:
  #   command: npx
  #   args:
  #   - -y
  #   - "@railway/mcp-server"

  sequential-thinking:
    command: npx
    args:
    - -y
    - "@modelcontextprotocol/server-sequential-thinking"

  terraform:
    command: gopass
    args:
    - env
    - --keep-case
    - env/ai-agent
    - --
    - docker
    - run
    - -i
    - --rm
    - -e
    - TFE_TOKEN
    - hashicorp/terraform-mcp-server:1.1.0
