kiro:
  ai.terminal-hash-sub: true
  app.hideMenubarIcon: true
  codeWhisperer.shareCodeWhispererContentWithAWS: false


  ## Agent
  chat.defaultModel: claude-opus-5
  chat.defaultAgent: cindy


  ## Chat UI
  chat.ui: tui
  chat.diffTool: delta
  chat.disableAutoCompaction: true
  chat.disableGranularTrust: false
  chat.disableWrap: false
  # Show greeting message on chat start
  chat.greeting.enabled: false
  # Enable edit mode for chat interface
  chat.editMode: true
  # Enable desktop notifications
  chat.enableNotifications: true
  # Show startup hints with tips and shortcuts
  chat.enablePromptHints: true
  # Show conversation history hints
  chat.enableHistoryHints: true
  # Show context usage percentage in prompt
  chat.enableContextUsageIndicator: true


  ## Display & Accessibility
  # Animated spinners and shimmers
  chat.allowAnimations: true
  # Unicode/braille symbols and box-drawing
  chat.allowAsciiArt: true
  # Status indicator icons (●, ○, ⚠).
  chat.allowIcons: true
  # Show the agent's reasoning (thinking) blocks in chat output
  chat.showThinking: true
  # Control how the CLI tool manages, stores, and scopes your persistent conversation history across your AI assistant sessions
  chat.historyMode: global


  ## API
  # API request timeout in seconds
  api.timeout: 1800


  ## MCP
  # Track previously loaded MCP servers
  mcp.loadedBefore: true
  # MCP server initialization timeout
  mcp.initTimeout: 10
  # Non-interactive MCP timeout
  mcp.noInteractiveTimeout: 5


  ## Tool Search
  # INFO: Enable Tool Search if:
  # - You have 5+ MCP servers configured
  # - You see context window overflow errors during long conversations
  # - The /tools command shows MCP tools consuming more than 50,000 tokens total
  # - If you only use a few MCP tools, the overhead of Tool Search may not be worth it.
  toolSearch.enabled: true
  # Activate when MCP tool specs exceed this % of context window
  toolSearch.minPct: 5
  # Activate when MCP tool specs exceed this token count
  toolSearch.minTokens: 50000


  ## Key Bindings
  chat.keybindings.cancelStream: esc
  chat.keybindings.closeMenu: esc
  chat.keybindings.quit: ctrl+c

  ## Observability
  telemetry.enabled: true


  ## Experimental
  chat.enableThinking: true
  chat.enableTangentMode: true
  chat.enableTodoList: true
  chat.enableCheckpoint: true

  # Configure key bindings
  chat.tangentModeKey: "t"
  chat.delegateModeKey: "d"
