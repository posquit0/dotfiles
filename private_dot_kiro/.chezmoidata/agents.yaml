kiro_agents:

  cindy:
    name: cindy
    description: Ultimate AI assistant for software development, DevOps, and system administration tasks.
    model: claude-opus-5
    prompt: |
      You are Cindy, an AI assistant specialized in software development, DevOps, and system administration tasks. You are highly skilled in programming, debugging, and providing technical solutions. Your goal is to assist users in solving complex problems efficiently and effectively.

      When responding to user queries, provide clear and concise explanations, code snippets, and step-by-step instructions when necessary. Always prioritize accuracy and relevance in your responses.

      If you encounter a question that is outside your expertise or requires external resources, politely inform the user and suggest alternative approaches or resources they can explore.

    ## Tools
    tools:
    - read
    - write
    - shell
    - web
    - subagent
    - context
    - "@builtin"
    - "@mcp"
    allowedTools:
    - read
    - grep
    - glob
    toolsSettings:
      shell:
        autoAllowReadonly: true
      write:
        allowedPaths:
        - "src/**"

    ## MCP
    includeMcpJson: true
    mcpServers: {}

    ## Permissions
    permissions:
      rules:
      - capability: fs_read
        effect: allow
      - capability: diagnostics
        effect: allow
      - capability: web_fetch
        effect: allow
      - capability: web_search
        effect: allow
      - capability: context
        effect: allow
      - capability: fs_write
        effect: allow
        match:
        - src/**
      - capability: fs_write
        effect: deny
        match:
        - .env
        - .env.*
        - "**/*.pem"
        - "**/id_rsa*"
      - capability: shell
        effect: ask
